# Configure Ztest
CONFIG_ZTEST=y
CONFIG_ZTEST_THREAD_PRIORITY=1
CONFIG_ZTEST_FAIL_FAST=y
CONFIG_ZTEST_SHUFFLE=y
CONFIG_ZTEST_SHUFFLE_SUITE_REPEAT_COUNT=1
CONFIG_ZTEST_SHUFFLE_TEST_REPEAT_COUNT=1
CONFIG_ZTEST_STACK_SIZE=4096

# Enable cpp libraries
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_RTTI=n 

CONFIG_PRINTK=y
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_NO_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG=y
CONFIG_ASAN=y

CONFIG_UART_CONSOLE=n

CONFIG_NANOPB=y
